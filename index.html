<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatório Oficial 👨‍🍳</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ffe0e6,#fff5f7);

padding:20px;

}

.card{

max-width:700px;

background:white;

padding:50px;

border-radius:30px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

text-align:center;

}

.chef{

margin-bottom:25px;

}

.chef img{

width:350px;

height:350px;

object-fit:cover;

border-radius:50%;

border:6px solid #ffd6de;

box-shadow:0 8px 20px rgba(0,0,0,.15);

}

h1{

color:#b71c3b;

margin-bottom:20px;

}

p{

font-size:1.15rem;

line-height:1.8;

color:#5a4a4a;

}

.status{

margin:25px 0;

font-size:1.3rem;

font-weight:bold;

color:#d62839;

}

.botao{

display:inline-block;

margin-top:20px;

padding:16px 35px;

background:#d62839;

color:white;

text-decoration:none;

border-radius:50px;

font-size:1.1rem;

font-weight:bold;

transition:.3s;

}

.botao:hover{

transform:scale(1.05);

background:#b71c3b;

}

</style>

</head>

<body>

<div class="card">

<div class="chef">
    <img src="jacquin.png" alt="Chef Jacquin">
</div>
<h1>RELATÓRIO OFICIAL DO CHEF JACQUIN</h1>

<p>
Após uma análise extremamente rigorosa,
foram encontrados níveis anormais de beleza,
carinho, fofura e gostosura muahahaha!
</p>

<div class="status">

✅ MELHOR NAMORADA IDENTIFICADA

</div>

<p>
Os resultados completos da inspeção
foram liberados para visualização.
</p>

<a href="surpresa.html" class="botao">

📋 Ver Relatório Completo

</a>

</div>

</body>
</html>
